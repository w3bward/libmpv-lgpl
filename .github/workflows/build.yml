name: build

# Builds and checks libmpv on every change, as separate DLLs and as a single DLL. A tag named mpv-<version>-r<n> (for
# example mpv-0.41.0-r1) also publishes both as a release, with their sources.
on:
  push:
    branches: [main]
    tags: ['mpv-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [separate, single]
    env:
      TARGET: x86_64-w64-mingw32
      WINEDEBUG: -all
      # Where build.sh puts each variant, and the suffix of its zip's name.
      SUFFIX: ${{ matrix.variant == 'single' && '-single' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Only what the build and the 64-bit smoke test use. make, git, curl, xz, zip and pipx are on the runner already.
      # The runner's Ubuntu mirror sometimes serves these 250 MB at a few hundred KB/s, so this allows 30 minutes.
      - name: Install tools
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install -o Acquire::Retries=3 --no-install-recommends -y \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm ninja-build pkgconf wine64
          pipx install meson==1.7.0

      - name: Build
        run: ./build.sh ${{ matrix.variant }}

      - name: Check it's an LGPL build
        run: python3 verify.py dist$SUFFIX

      # The test program links its own runtime statically, so it runs on nothing but what's in dist.
      - name: Smoke test under Wine
        run: |
          dist=dist$SUFFIX
          $TARGET-gcc-posix -O2 -I$dist/include smoke/smoke.c -o $dist/smoke.exe -static work/prefix$SUFFIX/lib/libmpv.dll.a
          cp smoke/clip.mp4 $dist/
          wine=$(command -v wine64 || echo /usr/lib/wine/wine64)
          (cd $dist && "$wine" smoke.exe)
          rm $dist/smoke.exe $dist/clip.mp4

      # Both variants are built from the same sources, so only one publishes them.
      - name: Package
        id: package
        run: |
          name="libmpv-lgpl-${GITHUB_REF_NAME//\//-}-x86_64"
          mkdir -p out
          (cd dist$SUFFIX && zip -qr9 "../out/$name$SUFFIX.zip" .)
          if [ "${{ matrix.variant }}" = separate ]; then
            cp sources/sources.tar.xz "out/$name-sources.tar.xz"
          fi
          (cd out && sha256sum *)
          echo "name=$name$SUFFIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mpv-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out/
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="libmpv-lgpl-${GITHUB_REF_NAME}-x86_64"
          (cd out && sha256sum * > SHA256SUMS)
          cat out/SHA256SUMS
          {
            echo "LGPL libmpv for 64-bit Windows, built from pinned sources. Checked before publishing: mpv built with -Dgpl=false, FFmpeg LGPL, no x264 or x265, and a smoke test that seeks exactly and steps a frame."
            echo
            echo "- \`$name.zip\`: libmpv and each dependency as its own DLL, so any of them can be replaced."
            echo "- \`$name-single.zip\`: libmpv and every dependency statically linked into one \`libmpv-2.dll\`, which loads nothing but Windows' own DLLs."
            echo "- \`$name-sources.tar.xz\`: the sources both were built from."
            echo
            echo '```'
            unzip -p "out/$name.zip" BUILDINFO.txt
            echo '```'
            echo
            echo 'SHA-256:'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
